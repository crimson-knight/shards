name: Release

# Builds and publishes a release when a tag is pushed.
# Usage: git tag v0.21.0-alpha.1 && git push origin v0.21.0-alpha.1

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
            artifact: minecart-darwin-arm64
          - os: macos-15-intel
            arch: x86_64
            artifact: minecart-darwin-x86_64
          - os: ubuntu-24.04
            arch: x86_64
            artifact: minecart-linux-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Install Crystal
        uses: oprypin/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f  # v1
        with:
          crystal: 1.21.0

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Build release binary
        run: make bin/minecart bin/shards-alpha release=1

      - name: Package binary
        run: |
          mkdir -p dist
          cp bin/minecart dist/
          cp bin/shards-alpha dist/
          cp LICENSE dist/
          cp man/shards.1 dist/ 2>/dev/null || true
          cp man/shard.yml.5 dist/ 2>/dev/null || true
          cd dist && tar czf ../${{ matrix.artifact }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Get changes since last tag
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline $PREV_TAG..HEAD)
          else
            CHANGES=$(git log --oneline -20)
          fi

          cat > release_notes.md <<EOF
          ## Minecart $VERSION

          Minecart is a drop-in compatible fork of
          [Crystal Shards](https://github.com/crystal-lang/shards), formerly
          distributed as \`shards-alpha\`.

          ### Alpha Features
          - **AI docs distribution**: \`minecart install\` copies AI docs from dependencies
          - **SBOM generation**: \`minecart sbom\` produces SPDX 2.3 / CycloneDX 1.6 JSON
          - **MCP server distribution**: Dependencies can ship MCP server configs
          - **Docs theming**: \`minecart docs\` with CSS theming and AI assistant buttons
          - **Postinstall tracking**: Version-aware script execution

          ### Install via Homebrew
          \`\`\`
          brew tap crimson-knight/tap
          brew install minecart
          \`\`\`

          ### Documentation
          [https://crimson-knight.github.io/shards](https://crimson-knight.github.io/shards)

          ### Install from binary
          Download the archive for your platform and extract \`minecart\` and
          \`shards-alpha\` to your PATH. The alias prints a deprecation notice.

          ### Changes
          \`\`\`
          $CHANGES
          \`\`\`
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Minecart ${{ steps.notes.outputs.version }}" \
            --notes-file release_notes.md \
            --prerelease \
            artifacts/minecart-darwin-arm64/*.tar.gz \
            artifacts/minecart-darwin-x86_64/*.tar.gz \
            artifacts/minecart-linux-x86_64/*.tar.gz
