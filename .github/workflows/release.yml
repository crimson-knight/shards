name: Release

# Builds and publishes a release when a tag is pushed.
# Usage: git tag v0.21.0-alpha.1 && git push origin v0.21.0-alpha.1

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
            artifact: shards-alpha-darwin-arm64
          - os: macos-15-intel
            arch: x86_64
            artifact: shards-alpha-darwin-x86_64
          - os: ubuntu-24.04
            arch: x86_64
            artifact: shards-alpha-linux-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Refresh Linux package indexes
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install Crystal
        uses: oprypin/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f  # v1
        with:
          crystal: 1.21.0

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Verify vendored dependency pins
        run: crystal run scripts/verify_vendored_dependencies.cr

      - name: Build release binary
        run: make bin/shards-alpha release=1

      - name: Package binary
        run: |
          mkdir -p dist
          cp bin/shards-alpha dist/
          cp LICENSE dist/
          cp man/shards.1 dist/ 2>/dev/null || true
          cp man/shard.yml.5 dist/ 2>/dev/null || true
          cd dist && tar czf ../${{ matrix.artifact }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Pin release assets and source commit
        run: |
          mkdir -p release_assets
          cp artifacts/*/*.tar.gz release_assets/
          curl --fail --location "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/refs/tags/${GITHUB_REF_NAME}" -o release_assets/shards-alpha-source.tar.gz
          git rev-parse HEAD > release_assets/SOURCE_COMMIT.txt
          (cd release_assets && sha256sum *.tar.gz > SHA256SUMS)

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Get changes since last tag
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline $PREV_TAG..HEAD)
          else
            CHANGES=$(git log --oneline -20)
          fi

          cat > release_notes.md <<EOF
          ## Shards Alpha $VERSION

          A [Crystal Shards](https://github.com/crystal-lang/shards)-compatible fork.
          This release preserves unchanged AI documentation and shared APFS storage.
          Customized documentation stays intact across repeated installs; explicit
          \`ai-docs update\` still restores upstream content.

          Source commit: \`$(git rev-parse HEAD)\`.
          Verify downloaded archives against the attached \`SHA256SUMS\` file.

          ### Alpha Features
          - **AI docs distribution**: \`shards install\` copies AI docs from dependencies
          - **SBOM generation**: \`shards sbom\` produces SPDX 2.3 / CycloneDX 1.6 JSON
          - **MCP server distribution**: Dependencies can ship MCP server configs
          - **Docs theming**: \`shards docs\` with CSS theming and AI assistant buttons
          - **Postinstall tracking**: Version-aware script execution

          ### Install via Homebrew
          \`\`\`
          brew tap crimson-knight/tap
          brew install shards-alpha
          \`\`\`

          ### Documentation
          [https://crimson-knight.github.io/shards](https://crimson-knight.github.io/shards)

          ### Install from binary
          Download the archive for your platform and extract \`shards-alpha\` to your PATH.

          ### Changes
          \`\`\`
          $CHANGES
          \`\`\`
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Shards Alpha ${{ steps.notes.outputs.version }}" \
            --notes-file release_notes.md \
            --prerelease \
            release_assets/*
