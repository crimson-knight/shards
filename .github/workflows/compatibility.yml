name: Compatibility

on:
  push:
    branches: [alpha, master]
  pull_request:
  workflow_dispatch:

jobs:
  amber-cli:
    name: amber_cli compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Crystal
        uses: oprypin/install-crystal@v1
        with:
          crystal: latest

      - name: Validate amber_cli compatibility
        env:
          AMBER_CLI_REF: main
        run: ./scripts/validate_amber_cli_compatibility.sh
