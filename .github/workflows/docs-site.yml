name: Docs Site

on:
  push:
    branches: [alpha]
  pull_request:
    branches: [alpha]
  release:
    types: [published]
  workflow_dispatch:

env:
  # GitHub currently recommends opting JavaScript actions into Node 24 ahead of
  # the Node 20 runner removal. This keeps the Pages pipeline off the deprecation path.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Crystal
        uses: oprypin/install-crystal@v1
        with:
          crystal: latest

      - name: Install dependencies
        run: shards install

      - name: Build docs site
        env:
          DOCS_PROJECT_NAME: Ashard
          DOCS_PROJECT_VERSION: ${{ github.event_name == 'release' && github.ref_name || 'alpha' }}
          DOCS_SOURCE_REFNAME: ${{ github.ref_name }}
          DOCS_CANONICAL_BASE_URL: https://crimson-knight.github.io/shards
          DOCS_BASE_PATH: /shards
        run: ./scripts/build_docs_site.sh

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
