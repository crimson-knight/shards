name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Every monday 6 AM

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
        crystal: [latest, nightly]
        include:
          - os: windows-2022
            crystal: nightly
          - os: ubuntu-22.04
            crystal: 1.0.0
    runs-on: ${{ matrix.os }}

    steps:
      - name: Configure Git
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          git config --global column.ui always
          git config --global core.autocrlf false

      - name: Install Crystal
        uses: oprypin/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f  # v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install Fossil and Mercurial
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install fossil mercurial

      - name: Install Fossil and Mercurial
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew update
          brew install fossil mercurial

      - name: Install Fossil and Mercurial
        if: ${{ runner.os == 'Windows' }}
        run: choco install fossil hg

      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Build
        run: make -f ${{ runner.os == 'Windows' && 'Makefile.win' || 'Makefile' }}

      - name: Run specs
        run: make -f ${{ runner.os == 'Windows' && 'Makefile.win' || 'Makefile' }} test

      - name: Check formatting
        run: crystal tool format --check src spec
