name: shards-alpha
version: 2025.11.25.5
description: |
 Minecart is a drop-in compatible fork of Crystal's Shards package manager,
 formerly distributed as shards-alpha. It adds AI docs distribution,
 SBOM generation, MCP server distribution, assistant configuration,
 supply chain compliance tools, docs theming, and postinstall tracking.

authors:
  - Julien Portalier <julien@portalier.com>
  - Seth Tucker

documentation: https://github.com/crimson-knight/shards
repository: https://github.com/crimson-knight/shards

dependencies:
  molinillo:
    github: crystal-lang/crystal-molinillo
  mcprotocol:
    github: crimson-knight/mcprotocol

targets:
  minecart:
    main: src/shards.cr
  shards-alpha:
    main: src/shards.cr

crystal: ">= 0.35.0, < 2.0.0"

license: Apache-2.0
